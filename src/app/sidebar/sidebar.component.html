
<div class="sidebar" [class.active]="isMobileSidebarActive"  (click)="toggleSidebarMobile()">
  <div class="sidebar-overlay" *ngIf="isMobileSidebarActive" (click)="closeSidebar()"></div>
<!--  -->

  <!-- Navigation -->
  <nav class="flex-grow-1 mt-5">
    <ul class="nav flex-column">
      <li class="nav-item mt-4" routerLinkActive="active">
        <a class="nav-link d-flex align-items-center" routerLink="/app/dashboard">
          <i class="fa fa-house me-3"></i>
          <span class="link-text">Dashboard</span>
        </a>
      </li>

      <li class="nav-item" routerLinkActive="active">
        <a class="nav-link d-flex align-items-center justify-content-between" routerLink="/app/loans">
          <div class="d-flex align-items-center">
            <i class="fa fa-list-check me-3"></i>
            <span class="link-text" >Loans</span>
          </div>
          <span  class="badge bg-gradient text-dark fw-semibold">New</span>
        </a>
      </li>

      <li class="nav-item" routerLinkActive="active">
        <a class="nav-link d-flex align-items-center" routerLink="/app/accounts">
          <i class="fa fa-wallet me-3"></i>
          <span class="link-text">Accounts</span>
        </a>
      </li>

      <li class="nav-item" routerLinkActive="active">
        <a class="nav-link d-flex align-items-center" routerLink="/app/transactions">
          <i class="fa fa-exchange-alt me-3"></i>
          <span class="link-text">Transactions</span>
        </a>
      </li>

      <!-- <li class="nav-item" routerLinkActive="active">
        <a class="nav-link d-flex align-items-center" routerLink="/app/reports">
          <i class="fa fa-chart-line me-3"></i>
          <span class="link-text" *ngIf="!isCollapsed">Reports & Insights</span>
        </a>
      </li> -->

      <li class="nav-item" routerLinkActive="active" style="cursor: pointer;">
        <a class="nav-link d-flex align-items-center" routerLink="/app/statement" (click)="viewStatement()" role="button">
          <i class="fa fa-file me-3"></i>
          <span class="link-text" >Statements</span>
        </a>
      </li>


       <li *ngIf="role !== 'DATA_MANAGER'" class="nav-item" routerLinkActive="active">
        <a class="nav-link d-flex align-items-center" routerLink="/app/management" (click)="management()">
          <i class="fa fa-user-check me-3"></i>
          <span class="link-text" >User Management</span>
        </a>
      </li>

      <li class="nav-item" routerLinkActive="active">
        <a class="nav-link d-flex align-items-center" routerLink="/app/user-profile">
          <i class="fa fa-user-circle me-3"></i>
          <span class="link-text" *ngIf="!isCollapsed">Profile</span>
        </a>
      </li>

         <!-- <li *ngIf="role !== 'DATA_MANAGER'" class="nav-item" routerLinkActive="active">
        <a class="nav-link d-flex align-items-center" routerLink="/app/settings">
          <i class="fa fa-gear me-3"></i>
          <span class="link-text">Settings</span>
        </a>
      </li> -->

<li *ngIf="role !== 'DATA_MANAGER'" class="nav-item mt-4">
  <a class="nav-link d-flex align-items-center logout-link"
     href="javascript:void(0)"
     (click)="logout()">
    <i class="bi bi-box-arrow-right me-3 text-danger"></i>
    <span class="link-text text-danger">
      Log Out
    </span>
  </a>
</li>
    </ul>
  </nav>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer text-center py-3 border-top small text-muted">
    <ng-container >&copy; 2025 CreditBank</ng-container>
    <i *ngIf="isCollapsed" class="fa fa-copyright"></i>
  </div>

  <!-- Collapse Button (hidden on mobile) -->
  <button
    class="btn btn-primary collapse-btn position-absolute bottom-0 end-0 m-3 rounded-circle d-none d-sm-block"
    (click)="toggleSidebar()"
  >
    <i
      class="fa fa-arrow-left text-white"
      [ngStyle]="{'transform': isCollapsed ? 'rotate(180deg)' : 'rotate(0deg)', 'transition': '0.3s ease'}"
    ></i>
  </button>
</div>

<!-- Main Content -->
<div class="main-content">
  <div class="body-content p-3">
    <router-outlet></router-outlet>
  </div>
</div>
