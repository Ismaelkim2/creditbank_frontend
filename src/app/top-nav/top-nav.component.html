<div class="top-nav d-flex justify-content-between align-items-center px-3 py-2 shadow-sm">

  <!-- Left: Logo + Hamburger -->
  <div class="d-flex align-items-center">
    <!-- Hamburger: show only on small devices -->
    <i class="fa fa-bars me-3 d-lg-none" (click)="toggleSidebar()"></i>
    <span class="fw-bold fs-4 text-primary">CrediCore</span>
  </div>

  <!-- Right: Search + User Info -->
  <div class="d-flex align-items-center gap-3 flex-grow-1 justify-content-end">

    <!-- Search -->
    <div class="position-relative d-flex align-items-center">
      <i class="fa fa-search search-icon text-dark" (click)="toggleSearch()"></i>
      <input
        *ngIf="showSearch"
        type="text"
        class="form-control search-input"
        placeholder="Search..."
      />
    </div>

  <!-- User Menu -->
<div class="user-menu position-relative ms-3 ms-lg-5">
  <div class="d-flex align-items-center user-info" (click)="toggleDropdown()">
    <!-- User Image -->
    <img
  *ngIf="imageUrl"
  [src]="imageUrl"
  alt="User Image"
  class="rounded-circle me-2"
  width="35"
  height="35"
/>


    <!-- Username -->
    <span class="fw-semibold text-dark d-none d-md-inline">{{ username }}</span>
    <i class="fa fa-caret-down ms-2 text-dark"></i>
  </div>

  <!-- Dropdown Menu -->
 <div
  class="dropdown-menu-custom position-absolute end-0 mt-2 shadow rounded bg-white"
  *ngIf="showDropdown"
>
  <a class="dropdown-item"><i class="fa fa-sliders-h me-2"></i> Preferences</a>
  <a class="dropdown-item"><i class="fa fa-language me-2"></i> Language</a>
  <a class="dropdown-item text-danger" (click)="signOut()"><i class="fa fa-sign-out-alt me-2"></i> Sign Out</a>
</div>

</div>


  </div>

</div>
